name: Post memos to X

on:
  push:
    paths:
      - 'source/memos/**'

jobs:
  post-memos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests requests_oauthlib

      - name: Post new memos to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET_KEY: ${{ secrets.X_API_SECRET_KEY }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref }}
        run: |
          python .github/scripts/post_memos_to_x.py

      - name: Dry run (no secrets)
        if: ${{ !secrets.X_API_KEY || !secrets.X_ACCESS_TOKEN }}
        run: echo "No X credentials found — Action did a dry-run (printed new items). Add secrets to enable posting."